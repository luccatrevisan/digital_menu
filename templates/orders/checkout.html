{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seu pedido | Chewie Cookies</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="{% static 'css/checkout.css' %}">
</head>

<body class="checkout-page">

    <main class="checkout">

        <header class="checkout-head">
            <div class="brand-badge">
                <img src="{% static 'img/logo_chewie.jpg' %}" alt="Chewie Cookies">
            </div>
            <div>
                <h1>Seu pedido</h1>
                <p>Confira os cookies e escolha onde entregar.</p>
            </div>
        </header>

        <div class="checkout-grid">

            <!-- ORDER SUMMARY -->
            <section class="summary">
                <h2>Seus cookies</h2>

                <div id="order-summary"></div>

                <div class="order-total">
                    <span>Total</span>
                    <strong id="cart-total">R$ 0,00</strong>
                </div>
            </section>

            <div class="side">

                <!-- DELIVERY ADDRESS -->
                <section class="delivery">
                    <h2>Onde entregar</h2>

                    <div id="address-list"></div>

                    <button id="new-address-button" class="btn-ghost" type="button">
                        Adicionar novo endereço
                    </button>

                    <form id="address-form" hidden>
                        <p id="address-warning" class="warning" hidden></p>

                        <div class="form-grid">
                            <label class="field">
                                CEP
                                <input type="text" id="cep" placeholder="Apenas números"
                                       inputmode="numeric" maxlength="8" required>
                            </label>

                            <label class="field">
                                Estado
                                <select id="state">
                                    <option value="RJ">RJ</option>
                                </select>
                            </label>

                            <label class="field wide">
                                Logradouro
                                <input type="text" id="street" placeholder="Rua dos Cookies" required>
                            </label>

                            <label class="field">
                                Número
                                <input type="text" id="number" placeholder="315, 32A, Lote 1 Quadra 4" required>
                            </label>

                            <label class="field">
                                Complemento
                                <input type="text" id="complement" placeholder="Apto, Bloco, Referência">
                            </label>

                            <label class="field">
                                Bairro
                                <input type="text" id="neighborhood" placeholder="Centro" required>
                            </label>

                            <label class="field">
                                Cidade
                                <input type="text" id="city" placeholder="Niterói, São Gonçalo" required>
                            </label>

                            <label class="field wide">
                                Tipo
                                <select id="label">
                                    <option value="CASA">Casa</option>
                                    <option value="TRABALHO">Trabalho</option>
                                </select>
                            </label>
                        </div>

                        <button type="submit" class="btn-primary">Salvar endereço</button>
                    </form>
                </section>

                <!-- ACTIONS -->
                <section class="checkout-actions">
                    <p id="order-warning" class="warning" hidden></p>
                    <button id="confirm-order" class="btn-primary" type="button">
                        Confirmar pedido
                    </button>
                    <a href="/" class="back-link">Voltar ao cardápio</a>
                </section>

            </div>
        </div>

    </main>

    <script src="{% static 'js/orders/cart.js' %}"></script>
    <script src="{% static 'js/orders/apiCalls.js' %}"></script>
    <script src="{% static 'js/orders/script.js' %}"></script>
    <script src="{% static 'js/orders/checkout.js' %}"></script>
</body>
</html>
